<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockedCode — App Flows & Architecture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#181b24;border-bottom:1px solid #2a2f3f;flex-shrink:0}
#topbar .app-title{font-weight:600;font-size:15px;color:#f1f5f9;white-space:nowrap}
#topbar .app-title span{color:#5b8af4}
#topbar .search-wrap{flex:1;max-width:400px;position:relative}
#topbar .search-wrap input{width:100%;padding:6px 10px 6px 30px;border-radius:6px;border:1px solid #2a2f3f;background:#1e2230;color:#e2e8f0;font-size:13px;outline:none}
#topbar .search-wrap input:focus{border-color:#5b8af4}
#topbar .search-wrap .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#64748b;font-size:13px}
#topbar .view-tabs{display:flex;gap:4px;margin-left:auto}
#topbar .view-tab{padding:6px 14px;border-radius:6px;border:1px solid #2a2f3f;background:transparent;color:#94a3b8;font-size:12px;cursor:pointer;transition:.15s}
#topbar .view-tab.active{background:#5b8af4;color:#fff;border-color:#5b8af4}
#topbar .view-tab:hover:not(.active){border-color:#5b8af4;color:#e2e8f0}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:200px;background:#181b24;border-right:1px solid #2a2f3f;padding:12px 0;flex-shrink:0;overflow-y:auto}
#sidebar .section-head{padding:8px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:600}
#sidebar .filter-item{padding:6px 16px;font-size:13px;color:#94a3b8;cursor:pointer;transition:.1s;border-left:2px solid transparent}
#sidebar .filter-item:hover{color:#e2e8f0;background:#1e2230}
#sidebar .filter-item.active{color:#5b8af4;border-left-color:#5b8af4;background:#1e2230}
#content{flex:1;overflow:hidden;position:relative}
.view-pane{display:none;height:100%;overflow:auto;padding:20px}
.view-pane.active{display:block}
/* Stats strip */
#stats-strip{display:flex;gap:24px;padding:12px 0 20px;border-bottom:1px solid #2a2f3f;margin-bottom:20px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;align-items:center}
.stat-item .stat-val{font-size:22px;font-weight:700;color:#f1f5f9}
.stat-item .stat-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
/* Flow cards */
#flow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.flow-card{background:#181b24;border:1px solid #2a2f3f;border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.flow-card:hover{border-color:#5b8af4;transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.flow-card .card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.flow-card .card-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.flow-card .card-name{font-weight:600;font-size:14px;color:#f1f5f9}
.flow-card .card-route{font-size:11px;color:#5b8af4;font-family:monospace;margin-bottom:4px}
.flow-card .card-summary{font-size:12px;color:#94a3b8;line-height:1.4;margin-bottom:8px}
.flow-card .card-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500}
.tag.blue{background:rgba(91,138,244,.2);color:#5b8af4}
.tag.green{background:rgba(52,211,153,.2);color:#34d399}
.tag.yellow{background:rgba(251,191,36,.2);color:#fbbf24}
.tag.red{background:rgba(248,113,113,.2);color:#f87171}
.tag.purple{background:rgba(167,139,250,.2);color:#a78bfa}
.tag.cyan{background:rgba(34,211,238,.2);color:#22d3ee}
.tag.orange{background:rgba(251,146,60,.2);color:#fb923c}
.tag.gray{background:rgba(100,116,139,.2);color:#94a3b8}
/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center}
#modal-overlay.show{display:flex}
#modal{background:#181b24;border:1px solid #2a2f3f;border-radius:14px;max-width:680px;width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6);padding:28px;position:relative}
#modal .close-btn{position:absolute;top:14px;right:16px;background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1}
#modal .close-btn:hover{color:#e2e8f0}
#modal .modal-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
#modal .modal-title{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
#modal .modal-route{font-family:monospace;font-size:12px;color:#5b8af4;margin-bottom:12px}
#modal .modal-section{margin-bottom:16px}
#modal .modal-section .ms-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:600;margin-bottom:6px}
#modal .modal-section p,#modal .modal-section li{font-size:13px;color:#cbd5e1;line-height:1.5}
#modal .modal-section ol{padding-left:18px}
#modal .modal-section ol li{margin-bottom:4px}
#modal .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
#modal .modal-grid .mg-item{background:#1e2230;border-radius:8px;padding:10px}
#modal .modal-grid .mg-label{font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:2px}
#modal .modal-grid .mg-value{font-size:13px;color:#e2e8f0;font-family:monospace}
/* Highlight search */
mark{background:rgba(91,138,244,.35);color:#e2e8f0;border-radius:2px;padding:0 2px}
/* Diagram view */
#diagram-wrap{position:relative;overflow:auto;height:100%}
#diagram-canvas{position:relative;min-height:600px;background-image:linear-gradient(rgba(42,47,63,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(42,47,63,.3) 1px,transparent 1px);background-size:24px 24px;padding-bottom:40px}
.diagram-lanes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 12px;position:relative}
.diagram-lane{border-right:1px solid #2a2f3f;min-height:400px;padding:0 8px 16px}
.diagram-lane:last-child{border-right:none}
.lane-header{text-align:center;padding:8px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:#0f1117;z-index:10;border-bottom:1px solid #2a2f3f;margin:0 -8px 12px}
.lane-header .lane-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lane-color-0{background:rgba(52,211,153,.3)}.lane-color-1{background:rgba(91,138,244,.3)}.lane-color-2{background:rgba(167,139,250,.3)}.lane-color-3{background:rgba(251,191,36,.3)}.lane-color-4{background:rgba(34,211,238,.3)}.lane-color-5{background:rgba(100,116,139,.3)}
.diagram-node{background:#1e2230;border:1px solid #2a2f3f;border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;transition:.15s;position:relative;z-index:2}
.diagram-node:hover{border-color:#5b8af4;background:#222840}
.diagram-node .node-label{font-size:12px;font-weight:500;color:#e2e8f0}
.diagram-node .node-sub{font-size:10px;color:#64748b;font-family:monospace;margin-top:2px}
.diagram-node.active{border-color:#5b8af4;background:#1e2a50;box-shadow:0 0 12px rgba(91,138,244,.3)}
.diagram-node.dimmed{opacity:.25}
/* Flow panel (right side in diagram view) */
#diagram-layout{display:flex;height:100%}
#diagram-main{flex:1;overflow:auto}
#flow-panel{width:260px;background:#181b24;border-left:1px solid #2a2f3f;display:flex;flex-direction:column;flex-shrink:0}
#flow-panel .panel-header{padding:10px 14px;font-size:12px;font-weight:600;color:#94a3b8;border-bottom:1px solid #2a2f3f;display:flex;align-items:center;gap:8px}
#legend-strip{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-bottom:1px solid #2a2f3f}
#legend-strip .legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#64748b}
#legend-strip .legend-dot{width:8px;height:8px;border-radius:50%}
#flow-list{flex:1;overflow-y:auto;padding:6px 0}
.flow-list-item{padding:8px 14px;cursor:pointer;border-left:3px solid transparent;font-size:12px;color:#94a3b8;transition:.1s}
.flow-list-item:hover{background:#1e2230;color:#e2e8f0}
.flow-list-item.active{background:#1e2230;border-left-color:#5b8af4;color:#f1f5f9}
#flow-steps-panel{border-top:1px solid #2a2f3f;padding:10px 14px;max-height:200px;overflow-y:auto}
#flow-steps-panel .step-title{font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:6px}
#flow-steps-panel .step-item{padding:3px 0;font-size:11px;color:#cbd5e1}
#flow-steps-panel .step-item .step-num{color:#5b8af4;margin-right:4px}
/* SVG connection layer */
#connections-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
@keyframes dashFlow{to{stroke-dashoffset:-24}}
.connection-path{stroke-dasharray:6 4;animation:dashFlow 1s linear infinite}
/* Scrollbar style */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2f3f;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3f4f}
/* Hide no-results by default */
.no-results{display:none;text-align:center;padding:60px 20px;color:#64748b}
.no-results.show{display:block}
</style>
</head>
<body>

<div id="topbar">
  <div class="app-title">🔒 <span>LockedCode</span> — App Flows</div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search-input" type="text" placeholder="Search flows, routes, providers, services..." oninput="onSearch()">
  </div>
  <div class="view-tabs">
    <button class="view-tab active" onclick="switchView('cards',this)">Flow Cards</button>
    <button class="view-tab" onclick="switchView('diagram',this)">Architecture Diagram</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="section-head">Sections</div>
    <div class="filter-item active" data-section="all" onclick="filterSection('all',this)">All Flows</div>
    <div class="filter-item" data-section="core" onclick="filterSection('core',this)">Core</div>
    <div class="filter-item" data-section="security" onclick="filterSection('security',this)">Security</div>
    <div class="filter-item" data-section="quality" onclick="filterSection('quality',this)">Quality</div>
    <div class="filter-item" data-section="advanced" onclick="filterSection('advanced',this)">Advanced</div>
    <div class="filter-item" data-section="external" onclick="filterSection('external',this)">External</div>
    <div class="section-head" style="margin-top:12px">Reference</div>
    <div class="filter-item" data-section="routes" onclick="filterSection('routes',this)">Routes</div>
    <div class="filter-item" data-section="providers" onclick="filterSection('providers',this)">Providers</div>
    <div class="filter-item" data-section="services" onclick="filterSection('services',this)">Services</div>
  </div>

  <div id="content">
    <!-- FLOW CARDS VIEW -->
    <div id="cards-view" class="view-pane active">
      <div id="stats-strip"></div>
      <div id="flow-grid"></div>
      <div class="no-results" id="no-results">No flows match your search.</div>
    </div>

    <!-- DIAGRAM VIEW -->
    <div id="diagram-view" class="view-pane">
      <div id="diagram-layout">
        <div id="diagram-main">
          <div id="diagram-wrap">
            <div id="diagram-canvas">
              <svg id="connections-svg"></svg>
              <div class="diagram-lanes" id="diagram-lanes"></div>
            </div>
          </div>
        </div>
        <div id="flow-panel">
          <div class="panel-header">📋 All Flows</div>
          <div id="legend-strip"></div>
          <div id="flow-list"></div>
          <div id="flow-steps-panel"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ============================================================
// APP DATA
// ============================================================
const APP_DATA = {
  meta: {
    app: "LockedCode",
    version: "1.0.0",
    platform: "Bun + Turborepo monorepo",
    db: "SQLite via Drizzle ORM (bun:sqlite)",
    state: "Effect-ts Context.Tag + Layer DI",
    routing: "Yargs CLI commands + HTTP API (Hono)",
    generated: new Date().toISOString().slice(0,10)
  },

  flows: [
    // ---- CORE ----
    {
      id: "f1", section: "core", icon: "▶", color: "#5b8af4",
      name: "Single Prompt Execution", route: "lockedcode run <message>",
      entry: "CLI: src/index.ts", exit: "STDOUT: final LLM response",
      summary: "Non-interactive run: send a prompt, get a response, exit. The primary user flow.",
      steps: [
        "1. Process starts — yargs parses CLI args, middleware initializes logs & runs JSON migration",
        "2. InstanceStore.load({directory}) loads project config, plugins, initializes LSP + file watchers",
        "3. Session.Service.create() inserts row in session table",
        "4. sdk.event.subscribe() opens SSE stream for session events",
        "5. sdk.session.prompt({parts:[text]}) -> HTTP request to in-process server",
        "6. Server handler receives prompt -> SessionPrompt.Service.prompt()",
        "7. createUserMessage() resolves agent, model, file attachments; creates message + part rows",
        "8. Context build: loads message history, builds system prompt (agent instructions + config + tools)",
        "9. LLM.Service.stream() -> streamText() (Vercel AI SDK) with resolved tools",
        "10. Tool resolution: resolveTools() -> ToolRegistry.tools() -> builtin + MCP + custom filtered by permissions",
        "11. Security interception: evaluatePolicy() -> scanContent()/scanCommand() -> audit recording",
        "12. LLM emits tool calls -> tool.execute() via Effect (read, grep, shell, write, etc.)",
        "13. Tool results stream back to LLM until final text response",
        "14. Events published on Bus -> SSE -> CLI subscriber renders output",
        "15. Session idle -> session.status event -> CLI exits"
      ],
      providers: ["Session.Service", "SessionPrompt.Service", "LLM.Service", "ToolRegistry.Service", "Config.Service", "Security.Service", "Bus.Service", "Permission.Service"],
      services: ["SessionService", "SessionPromptService", "LLMService", "ToolRegistry", "ConfigService", "SecurityService", "BusService", "PermissionService"],
      db_tables: ["session", "message", "part", "project", "permission", "security_event", "model_registry"],
      nodes: {
        user: ["cli", "stdin_stdout"],
        screens: ["src/index.ts", "cmd/run.ts", "session/prompt.ts", "session/llm.ts", "tool/registry.ts"],
        providers: ["Session.Service", "SessionPrompt.Service", "LLM.Service", "ToolRegistry.Service", "Config.Service", "Security.Service", "Bus.Service", "Permission.Service"],
        services: ["InstanceStore", "SessionService", "SessionPrompt", "LLM", "ToolRegistry", "Security", "Bus", "Permission"],
        db: ["session", "message", "part", "project", "permission", "security_event"],
        external: ["LLM Provider API", "tree-sitter WASM"]
      },
      tags: [["cli","blue"],["core","green"],["execution","cyan"]]
    },
    {
      id: "f2", section: "core", icon: "💬", color: "#34d399",
      name: "Interactive Mode", route: "lockedcode run --interactive",
      entry: "CLI: cmd/run/runtime.ts", exit: "Ctrl+C or session idle",
      summary: "Full TUI session: user types prompts in a split-footer UI, sees streaming responses inline.",
      steps: [
        "1. Same init as single prompt through session creation",
        "2. Boots in-process HTTP server",
        "3. Launches SolidJS split-footer TUI (cmd/run/runtime.ts + footer.tsx)",
        "4. User types in footer prompt, submits -> SDK prompt() call path",
        "5. Scrollback buffer renders messages; tool calls displayed inline in TUI",
        "6. Permission prompts shown in footer; user approves/denies via keyboard",
        "7. Session status events update TUI footer (spinner, token count, timer)",
        "8. Exit on Ctrl+C or after session idle timeout"
      ],
      providers: ["Session.Service", "SessionPrompt.Service", "LLM.Service", "ToolRegistry.Service", "Runtime.Service"],
      services: ["SessionService", "SessionPrompt", "LLM", "ToolRegistry", "InstanceStore", "RuntimeBoot"],
      db_tables: ["session", "message", "part"],
      nodes: {
        user: ["developer_tui"],
        screens: ["cmd/run/runtime.ts", "cmd/run/footer.tsx", "cmd/run/scrollback.ts", "cmd/run/permission.shared.ts", "cmd/run/question.shared.ts"],
        providers: ["Session.Service", "SessionPrompt.Service", "Runtime.Service", "ToolRegistry.Service"],
        services: ["RuntimeBoot", "RuntimeLifecycle", "Scrollback", "PermissionPrompt", "QuestionHandler"],
        db: ["session", "message", "part"],
        external: ["STDIN", "STDOUT (ANSI/TUI)"]
      },
      tags: [["tui","green"],["interactive","cyan"],["core","blue"]]
    },
    {
      id: "f3", section: "core", icon: "🔗", color: "#a78bfa",
      name: "Remote Attach Session", route: "lockedcode run --interactive --attach <url>",
      entry: "CLI: cmd/run.ts + HTTP SDK", exit: "Ctrl+C or disconnect",
      summary: "Connect TUI to a remote LockedCode server instance.",
      steps: [
        "1. Connect to remote server via HTTP SDK (configured by --attach flag)",
        "2. Auth headers sent with each request (API key or OAuth)",
        "3. All session management happens server-side",
        "4. Local TUI renders same as interactive mode",
        "5. SSE stream from server drives real-time scrollback updates",
        "6. Input handled locally, sent as HTTP requests to remote server"
      ],
      providers: ["Session.Service", "SDK/Client", "Runtime.Service"],
      services: ["HttpClient", "SSEStream", "Runtime", "AuthClient"],
      db_tables: ["session", "message", "part"],
      nodes: {
        user: ["developer_tui"],
        screens: ["cmd/run/runtime.ts", "cmd/run/footer.tsx", "http-client.ts"],
        providers: ["SDK.Client", "Runtime.Service"],
        services: ["HttpClient", "SSEStream", "AuthClient"],
        db: [],
        external: ["Remote LockedCode Server (HTTP)", "mDNS discovery (bonjour-service)"]
      },
      tags: [["remote","purple"],["tui","green"],["core","blue"]]
    },

    // ---- SECURITY ----
    {
      id: "f4", section: "security", icon: "🛡", color: "#f87171",
      name: "Policy Evaluation (Chokepoint 1)", route: "on tool.execute()",
      entry: "tool/registry.ts: tools() method", exit: "allow/deny decision returned to tool executor",
      summary: "Every tool call passes through SecurityService.evaluatePolicy() before execution.",
      steps: [
        "1. Tool.execute() is called by LLM processor",
        "2. Security-evaluated wrapper in registry.ts intercepts",
        "3. SecurityService.evaluatePolicy({action: tool.id, params, model}) called",
        "4. PolicyEngine loads merged policy (builtin -> XDG -> lockedcode.yaml -> session)",
        "5. evaluate() iterates rules in reverse; last match wins",
        "6. If deny -> AuditService.record(ActionBlocked) + return blocked response to LLM",
        "7. If allow -> proceed to trust scoring",
        "8. SecurityService.scoreTrust({action, params, policyResult}) returns 0-100 score",
        "9. If score > promptThreshold -> ctx.ask() requires user approval",
        "10. If score > blockThreshold -> hard block, no override",
        "11. On pass -> call confine() for filesystem-touching tools",
        "12. Call scan() for write/edit/patch tools",
        "13. Proceed to original tool execute",
        "14. After execute -> AuditService.record() with full result"
      ],
      providers: ["Security.Service", "PolicyEngine.Service", "AuditService.Service", "TrustService.Service", "Permission.Service", "Bus.Service"],
      services: ["SecurityService", "PolicyEngine", "AuditService", "TrustService", "PermissionService", "ConfinementService", "ScanningService"],
      db_tables: ["security_event", "policy_document", "model_registry", "model_trust"],
      nodes: {
        user: ["administrator"],
        screens: ["tool/registry.ts", "security/index.ts", "policy/index.ts", "audit/index.ts", "trust/index.ts"],
        providers: ["Security.Service", "PolicyEngine.Service", "AuditService.Service", "TrustService.Service", "Permission.Service", "Bus.Service"],
        services: ["SecurityService", "PolicyEngine", "AuditService", "TrustService", "PermissionService", "ConfinementService", "ScanningService"],
        db: ["security_event", "policy_document", "model_registry", "model_trust"],
        external: ["lockedcode.yaml config file"]
      },
      tags: [["security","red"],["policy","orange"],["core","blue"]]
    },
    {
      id: "f5", section: "security", icon: "🔒", color: "#fb923c",
      name: "Shell Command Scan (Chokepoint 2)", route: "shell.ts execute()",
      entry: "tool/shell.ts: execute() between parse and spawn", exit: "command allowed/blocked",
      summary: "All shell commands are parsed via tree-sitter, paths extracted, and validated against policy & confinement.",
      steps: [
        "1. LLM emits shell tool call",
        "2. ShellTool.execute() called",
        "3. Command string parsed via tree-sitter WASM (bash or PowerShell)",
        "4. Extracted file paths from command (redirects, args, subshells)",
        "5. SecurityService.evaluatePolicy({action: 'shell', command, extractedPaths})",
        "6. SecurityService.confine({paths: extractedPaths}) -> validate all paths against project root",
        "7. Check hard-blocked command patterns (rm -rf /, curl | bash, etc.)",
        "8. SecurityService.scoreTrust({action: 'shell', command})",
        "9. If any check denies -> AuditService.record + return blocked",
        "10. If pass -> ctx.ask('bash', patterns) for permission ruleset",
        "11. Fork shell process via PTY layer (Bun/Node adapter)",
        "12. Stream output back through session processor",
        "13. AuditService.record(completed) with command, duration, exit code"
      ],
      providers: ["Security.Service", "PolicyEngine.Service", "AuditService.Service", "Permission.Service", "ConfinementService.Service"],
      services: ["SecurityService", "PolicyEngine", "AuditService", "PermissionService", "ConfinementService", "ShellPTY"],
      db_tables: ["security_event", "policy_document"],
      nodes: {
        user: ["developer"],
        screens: ["tool/shell.ts", "shell/shell.ts", "security/index.ts", "confinement/index.ts"],
        providers: ["Security.Service", "PolicyEngine.Service", "Permission.Service", "ConfinementService.Service"],
        services: ["SecurityService", "PolicyEngine", "ConfinementService", "ShellPTY", "PathCanonicalizer"],
        db: ["security_event"],
        external: ["tree-sitter WASM", "OS Shell (bash/zsh/pwsh)", "PTY Layer"]
      },
      tags: [["security","red"],["shell","orange"],["chokepoint","yellow"]]
    },
    {
      id: "f6", section: "security", icon: "🔍", color: "#22d3ee",

// ============================================================
// DERIVED DATA
// ============================================================
const FLOW_COLORS = {};
APP_DATA.flows.forEach(f => { FLOW_COLORS[f.id] = f.color });

function buildDiagramNodes() {
  const nodes = [];
  const laneMap = { user: 0, screens: 1, providers: 2, services: 3, db: 4, external: 5 };
  const seen = new Set();
  APP_DATA.flows.forEach(f => {
    Object.entries(f.nodes).forEach(([laneKey, items]) => {
      items.forEach(label => {
        const id = laneKey + "_" + label.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase();
        if (!seen.has(id)) {
          seen.add(id);
          nodes.push({ id, lane: laneMap[laneKey], label, sub: "", type: laneKey });
        }
      });
    });
  });
  return nodes;
}
const DIAGRAM_NODES = buildDiagramNodes();

const FLOW_NODE_MAP = {};
APP_DATA.flows.forEach(f => {
  const ids = [];
  Object.entries(f.nodes).forEach(([laneKey, items]) => {
    items.forEach(label => {
      const id = laneKey + "_" + label.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase();
      ids.push(id);
    });
  });
  FLOW_NODE_MAP[f.id] = ids;
});

function buildFlowConnections() {
  const conns = {};
  const lanes = Object.keys({ user:0, screens:1, providers:2, services:3, db:4, external:5 });
  APP_DATA.flows.forEach(f => {
    const pairs = [];
    const allNodes = [];
    lanes.forEach(l => {
      (f.nodes[l] || []).forEach(label => {
        const id = l + "_" + label.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase();
        allNodes.push(id);
      });
    });
    for (let i = 0; i < allNodes.length - 1; i++) {
      pairs.push([allNodes[i], allNodes[i+1]]);
    }
    conns[f.id] = pairs;
  });
  return conns;
}
const FLOW_CONNECTIONS = buildFlowConnections();

function renderFlowCards(filterSection, searchTerm) {
  const grid = document.getElementById("flow-grid");
  const noRes = document.getElementById("no-results");
  let items = APP_DATA.flows;
  if (filterSection && filterSection !== "all") {
    items = items.filter(f => f.section === filterSection);
  }
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    items = items.filter(f =>
      f.name.toLowerCase().includes(q) ||
      f.summary.toLowerCase().includes(q) ||
      f.route.toLowerCase().includes(q) ||
      f.services.some(s => s.toLowerCase().includes(q)) ||
      f.providers.some(p => p.toLowerCase().includes(q)) ||
      f.db_tables.some(t => t.toLowerCase().includes(q)) ||
      f.tags.some(t => t[0].toLowerCase().includes(q))
    );
  }
  if (items.length === 0) {
    grid.innerHTML = "";
    noRes.classList.add("show");
    return;
  }
  noRes.classList.remove("show");
  grid.innerHTML = items.map(f => `
    <div class="flow-card" onclick="openModal('${f.id}')" data-section="${f.section}">
      <div class="card-header">
        <div class="card-icon" style="background:${f.color}22;color:${f.color}">${f.icon}</div>
        <div class="card-name" style="color:${f.color}">${highlight(f.name, searchTerm)}</div>
      </div>
      <div class="card-route">${highlight(f.route, searchTerm)}</div>
      <div class="card-summary">${highlight(f.summary, searchTerm)}</div>
      <div class="card-tags">${f.tags.map(t => `<span class="tag ${t[1]}">${t[0]}</span>`).join("")}</div>
    </div>
  `).join("");
}

function highlight(text, term) {
  if (!term) return text;
  const q = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
}

// ============================================================

function switchView(view, btn) {
  document.querySelectorAll(".view-tab").forEach(t => t.classList.remove("active"));
  if (btn) btn.classList.add("active");
  document.querySelectorAll(".view-pane").forEach(p => p.classList.remove("active"));
  currentView = view;
  if (view === "cards") {
    document.getElementById("cards-view").classList.add("active");
    const searchTerm = document.getElementById("search-input").value;
    renderFlowCards(currentSection, searchTerm);
  } else {
    document.getElementById("diagram-view").classList.add("active");
    renderStats();
    buildDiagram();
  }
}

// ============================================================
// DIAGRAM
// ============================================================
function buildDiagram() {
  const lanes = [
    { name: "User / Entry", color: "#34d399" },
    { name: "Screens", color: "#5b8af4" },
    { name: "Providers", color: "#a78bfa" },
    { name: "Services", color: "#fbbf24" },
    { name: "Database", color: "#22d3ee" },
    { name: "External", color: "#64748b" }
  ];

  const laneEls = document.getElementById("diagram-lanes");
  laneEls.innerHTML = lanes.map((l, i) => `
    <div class="diagram-lane" data-lane="${i}">
      <div class="lane-header"><span class="lane-dot lane-color-${i}"></span>${l.name}</div>
      <div class="lane-nodes" data-lane="${i}"></div>
    </div>
  `).join("");

  DIAGRAM_NODES.forEach(node => {
    const container = laneEls.querySelector(`.lane-nodes[data-lane="${node.lane}"]`);
    const types = ["cli","developer","administrator","api_client","remote_client","github_user","security_team"];
    const icon = types.includes(node.type) ? "👤" : node.type === "screens" ? "📄" : node.type === "providers" ? "⚡" : node.type === "services" ? "⚙" : node.type === "db" ? "🗄" : "🌐";
    const el = document.createElement("div");
    el.className = "diagram-node";
    el.id = "node-" + node.id;
    el.innerHTML = `<div class="node-label">${icon} ${node.label}</div>${node.sub ? `<div class="node-sub">${node.sub}</div>` : ""}`;
    el.onclick = () => onNodeClick(node.id);
    container.appendChild(el);
  });

  // Build legend
  document.getElementById("legend-strip").innerHTML = lanes.map((l, i) =>
    `<span class="legend-item"><span class="legend-dot" style="background:${l.color}"></span>${l.name}</span>`
  ).join("");

  // Build flow list
  buildFlowList();

  // Initial connections redraw after layout
  requestAnimationFrame(() => {
    if (activeFlowId) drawConnections(activeFlowId);
  });
}

function buildFlowList() {
  const list = document.getElementById("flow-list");
  list.innerHTML = APP_DATA.flows.map(f => `
    <div class="flow-list-item${f.id === activeFlowId ? ' active' : ''}" data-flow="${f.id}" onclick="selectFlow('${f.id}')">
      <span style="color:${f.color}">${f.icon}</span> ${f.name}
    </div>
  `).join("");
  renderFlowSteps();
}

function renderFlowSteps() {
  const panel = document.getElementById("flow-steps-panel");
  const f = APP_DATA.flows.find(x => x.id === activeFlowId);
  if (!f) {
    panel.innerHTML = `<div class="step-title">Select a flow to see steps</div>`;
    return;
  }
  panel.innerHTML = `<div class="step-title">${f.icon} ${f.name} — Steps</div>
    ${f.steps.map(s => `<div class="step-item"><span class="step-num">${s.match(/^(\d+)/)?.[1] || '•'}</span>${s.replace(/^\d+\.\s*/, '')}</div>`).join("")}
  `;
}

let selectedFirstNode = null;

function onNodeClick(nodeId) {
  // Find first flow that uses this node
  const flowEntry = Object.entries(FLOW_NODE_MAP).find(([_, nodes]) => nodes.includes(nodeId));
  if (!flowEntry) return;
  const flowId = flowEntry[0];
  if (flowId === activeFlowId && selectedFirstNode === nodeId) {
    // Second click: open modal
    openModal(flowId);
    return;
  }
  selectedFirstNode = nodeId;
  selectFlow(flowId);
}

// ============================================================
// FLOW SELECTION
// ============================================================
function selectFlow(id) {
  if (activeFlowId === id) {
    clearFlowSelection();
    return;
  }
  activeFlowId = id;

  // Dim all nodes, activate matching
  document.querySelectorAll(".diagram-node").forEach(n => n.classList.add("dimmed"));
  document.querySelectorAll(".diagram-node.active").forEach(n => n.classList.remove("active"));
  (FLOW_NODE_MAP[id] || []).forEach(nid => {
    const el = document.getElementById("node-" + nid);
    if (el) { el.classList.remove("dimmed"); el.classList.add("active"); }
  });

  // Update flow list
  document.querySelectorAll(".flow-list-item").forEach(i => i.classList.remove("active"));
  const li = document.querySelector(`.flow-list-item[data-flow="${id}"]`);
  if (li) li.classList.add("active");

  drawConnections(id);
  renderFlowSteps();
}

function clearFlowSelection() {
  activeFlowId = null;
  selectedFirstNode = null;
  document.querySelectorAll(".diagram-node").forEach(n => { n.classList.remove("dimmed"); n.classList.remove("active"); });
  document.querySelectorAll(".flow-list-item").forEach(i => i.classList.remove("active"));
  const svg = document.getElementById("connections-svg");
  svg.innerHTML = "";
  renderFlowSteps();
}

function drawConnections(flowId) {
  const svg = document.getElementById("connections-svg");
  const canvas = document.getElementById("diagram-canvas");
  const rect = canvas.getBoundingClientRect();
  svg.setAttribute("width", rect.width);
  svg.setAttribute("height", rect.height);

  const lanes = canvas.querySelectorAll(".diagram-lane");
  const laneRects = [];
  lanes.forEach((l, i) => {
    const r = l.getBoundingClientRect();
    laneRects[i] = { left: r.left - rect.left, right: r.right - rect.left, width: r.width };
  });

  const pairs = FLOW_CONNECTIONS[flowId] || [];
  const color = FLOW_COLORS[flowId] || "#5b8af4";
  let paths = "";

  pairs.forEach(([fromId, toId]) => {
    const fromEl = document.getElementById("node-" + fromId);
    const toEl = document.getElementById("node-" + toId);
    if (!fromEl || !toEl) return;

    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();

    const x1 = fromRect.left - rect.left + fromRect.width;
    const y1 = fromRect.top - rect.top + fromRect.height / 2;
    const x2 = toRect.left - rect.left;
    const y2 = toRect.top - rect.top + toRect.height / 2;

    const cx1 = x1 + Math.abs(x2 - x1) * 0.4;
    const cy1 = y1;
    const cx2 = x2 - Math.abs(x2 - x1) * 0.4;
    const cy2 = y2;

    paths += `<path d="M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}" stroke="${color}" stroke-width="1.5" fill="none" class="connection-path" marker-end="url(#arrow-${flowId.replace(/[^a-z0-9]/g,'')})"/>`;
  });

  svg.innerHTML = `
    <defs>
      <marker id="arrow-${flowId.replace(/[^a-z0-9]/g,'')}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="${color}"/>
      </marker>
    </defs>
    ${paths}
  `;
}

// Redraw connections on scroll/resize
let redrawTimer;
document.getElementById("diagram-wrap")?.addEventListener("scroll", () => {
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(() => { if (activeFlowId) drawConnections(activeFlowId); }, 100);
});
window.addEventListener("resize", () => {
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(() => { if (activeFlowId) drawConnections(activeFlowId); }, 100);
});

// Keyboard: Escape closes modal
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

// ============================================================
// INIT
// ============================================================
renderStats();
renderFlowCards("all", "");
renderStats();
